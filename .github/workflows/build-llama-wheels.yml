# FNGarvin - Attested llama-cpp-python Wheel Builder
#
# On-demand only (workflow_dispatch). Builds the 3 CUDA-accelerated
# llama-cpp-python wheels this repo actually consumes:
#   - Windows,        Python 3.10  (Install.bat / native Windows)
#   - Linux,          Python 3.10  (install.sh / native Linux/WSL)
#   - Linux,          Python 3.12  (Dockerfile / container, matches the
#                                    pytorch/pytorch base image's system Python)
#
# Each wheel targets ALL supported CUDA architectures in one universal
# binary (Turing through Blackwell - see CUDAARCHVER below), so there is
# no more "standard vs Blackwell" wheel split, and no runtime hot-swap.
# This directly replaces the previous hand-built wheels, which shipped
# with a real arch-selection bug: the Windows Blackwell build never set
# -DCMAKE_CUDA_ARCHITECTURES at all (so CMake/nvcc silently auto-detected
# off the build machine's own GPU), and the Linux build doc told you to
# use "=90", which is Hopper, not Blackwell (sm_120). Building on a
# GPU-less GitHub-hosted runner with an explicit arch list makes that
# whole bug class structurally impossible: there is nothing to
# auto-detect, and the arch list is spelled out right here.
#
# Source is pinned to an immutable commit SHA on the JamePeng fork (not a
# branch or tag) - the exact commit JamePeng themselves tagged as the
# v0.3.44 cu128 release (same commit for both platforms this time). See
# docs/BUILD_WHEELS_HOWTO.md for how this was identified and how to bump
# it again if a future upgrade is wanted.
#
# v0.3.44 was picked up specifically to get current Gemma 4 (Gemma4ChatHandler,
# landed v0.3.35/v0.3.36) and Qwen3.5/Qwen3.6/Qwen3-Next support (v0.3.36/
# v0.3.39) - both already present well before this pin, so this is a normal
# "latest tested release" bump, not a special-case one.
#
# The build recipe itself changed substantially at this pin vs the previous
# v0.3.26 one - ported here to match JamePeng's own tested recipe rather than
# grafting old flags onto a new source commit:
#   - CPU dispatch: one "Basic" (no-SIMD) build -> GGML_BACKEND_DL +
#     GGML_CPU_ALL_VARIANTS (runtime-selected CPU backend DLLs/.so's).
#   - Windows: MSVC/MSBuild -> Ninja Multi-Config + Clang/LLVM via the
#     toolchain file shipped in the llama.cpp submodule itself
#     (vendor/llama.cpp/cmake/x64-windows-llvm.cmake) - JamePeng's own
#     comment: MSVC skips several GGML CPU all-variant backends (ivybridge,
#     piledriver, cooperlake, zen4, sapphirerapids).
#   - New flags: LLAMA_BUILD_BORINGSSL, LLAMA_BUILD_EXAMPLES/TESTS/TOOLS/
#     SERVER/UI=OFF, CUDA diag-suppress.
#   - Arch list: JamePeng's own build dropped 101-real (kept 100-real and
#     120-real) - matched here rather than diverging from what's tested.
#
# Every wheel gets a SLSA build provenance attestation
# (actions/attest-build-provenance) binding it to this workflow run and
# source commit. Verify any downloaded wheel with:
#   gh attestation verify <wheel-file> --owner <this-repo-owner>

name: Build Attested llama-cpp-python Wheels

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for the release these wheels get published under"
        required: true
        default: "v5.4-llama-deps"

permissions:
  contents: read

env:
  CUDAVER: "12.8.1"
  # Turing / Ampere / Ada / Hopper / Blackwell (consumer + datacenter),
  # "-real" = embed SASS only (no PTX) for each listed arch - matches
  # exactly what JamePeng's own build used for this commit, keeps wheel
  # size sane vs "all"/PTX-inclusive builds.
  CUDAARCHVER: "75-real;80-real;86-real;87-real;89-real;90-real;100-real;120-real"
  # Immutable commit SHA, not a branch/tag - see docs/BUILD_WHEELS_HOWTO.md.
  # JamePeng/llama-cpp-python's own tagged v0.3.44 cu128 release commit,
  # shared by both platform tags (v0.3.44-cu128-linux-20260721 /
  # v0.3.44-cu128-win-20260721).
  LLAMA_CPP_PYTHON_LINUX_REF: "ebf6099b81cf67cfb5eec569466367c9fa04e9d4"
  LLAMA_CPP_PYTHON_WIN_REF: "ebf6099b81cf67cfb5eec569466367c9fa04e9d4"

concurrency:
  group: build-llama-wheels-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows wheel (py${{ matrix.pyver }})
    runs-on: windows-2022
    permissions:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        pyver: ["3.10"]
    defaults:
      run:
        shell: pwsh
    env:
      MAX_JOBS: 12
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Checkout llama-cpp-python (JamePeng fork, pinned commit)
        uses: actions/checkout@v6
        with:
          repository: JamePeng/llama-cpp-python
          ref: ${{ env.LLAMA_CPP_PYTHON_WIN_REF }}
          submodules: recursive

      - name: Install CUDA ${{ env.CUDAVER }}
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: ${{ env.CUDAVER }}
          use-github-cache: false

      - name: Install uv and Python ${{ matrix.pyver }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.pyver }}
          activate-environment: true
          enable-cache: true

      - name: Install build dependencies
        run: |
          git config --system core.longpaths true
          uv pip install --upgrade build setuptools wheel packaging

      - name: Setup MSVC environment for nvcc
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          echo PATH=%PATH%>>%GITHUB_ENV%
          echo INCLUDE=%INCLUDE%>>%GITHUB_ENV%
          echo LIB=%LIB%>>%GITHUB_ENV%
          echo LIBPATH=%LIBPATH%>>%GITHUB_ENV%

      - name: Build wheel
        run: |
          $cudaVersion = $env:CUDAVER.Remove($env:CUDAVER.LastIndexOf('.')).Replace('.', '')
          $env:CUDA_HOME = $env:CUDA_PATH
          $env:CUDA_TOOLKIT_ROOT_DIR = $env:CUDA_PATH
          $env:VERBOSE = '1'

          # Force CMake to use Ninja + LLVM/Clang instead of the default
          # Visual Studio generator - MSVC skips several GGML CPU
          # all-variant backends (ivybridge, piledriver, cooperlake, zen4,
          # sapphirerapids). Toolchain file ships in the llama.cpp submodule.
          $env:CMAKE_GENERATOR = 'Ninja Multi-Config'
          $toolchainFile = (Join-Path $env:GITHUB_WORKSPACE "vendor\llama.cpp\cmake\x64-windows-llvm.cmake")
          if (!(Test-Path $toolchainFile)) {
            Write-Error "Toolchain file not found: $toolchainFile"
            exit 1
          }
          $toolchainFile = $toolchainFile.Replace('\', '/')

          $cudaDiagSuppress = '--diag-suppress=177,221,550'

          $cmakeArgs = @(
            "-DCMAKE_TOOLCHAIN_FILE=$toolchainFile"
            '-DLLAMA_BUILD_BORINGSSL=ON'

            # Disable non-wheel targets.
            '-DLLAMA_BUILD_EXAMPLES=OFF'
            '-DLLAMA_BUILD_TESTS=OFF'
            '-DLLAMA_BUILD_TOOLS=OFF'
            '-DLLAMA_BUILD_SERVER=OFF'
            '-DLLAMA_BUILD_UI=OFF'
            '-DLLAMA_USE_PREBUILT_UI=OFF'
            '-DLLAMA_CURL=OFF'

            # GGML dynamic backend layout - runtime-selected CPU backend
            # DLLs plus CUDA, no more single baked-in "Basic" CPU build.
            '-DGGML_CPU=ON'
            '-DGGML_CUDA=ON'
            '-DGGML_NATIVE=OFF'
            '-DGGML_BACKEND_DL=ON'
            '-DGGML_CPU_ALL_VARIANTS=ON'
            '-DGGML_OPENMP=ON'

            # CUDA backend.
            "-DCMAKE_CUDA_ARCHITECTURES=$env:CUDAARCHVER"
            '-DGGML_CUDA_FORCE_MMQ=ON'
            '-DCUDA_SEPARABLE_COMPILATION=ON'
            "-DCMAKE_CUDA_FLAGS=$cudaDiagSuppress"

            # Build behavior.
            "-DCMAKE_BUILD_PARALLEL_LEVEL=$env:MAX_JOBS"
            '-DENABLE_CCACHE=ON'
          )
          $env:CMAKE_ARGS = $cmakeArgs -join ' '
          Write-Output "CMAKE_ARGS=$env:CMAKE_ARGS"

          python -m build --wheel

          if (!(Test-Path '.\dist\*.whl')) {
            Write-Error "No wheel built in dist/ directory"
            exit 1
          }

          $wheelFile = Get-Item '.\dist\*.whl' | Select-Object -First 1
          $parts = $wheelFile.Name.Split('-')
          $distName = $parts[0]
          $version  = $parts[1]
          $pyTag    = $parts[2]
          $abiTag   = $parts[3]
          $platTag  = $parts[4]

          $newVersion = "$version+cu$cudaVersion"
          $newName = "$distName-$newVersion-$pyTag-$abiTag-$platTag"
          Rename-Item -Path $wheelFile.FullName -NewName $newName
          Write-Output "Built: $newName"
        env:
          CUDAVER: ${{ env.CUDAVER }}
          CUDAARCHVER: ${{ env.CUDAARCHVER }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-win-py${{ matrix.pyver }}
          path: dist/*.whl
          if-no-files-found: error

  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux wheel (py${{ matrix.pyver }})
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
    permissions:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # 3.10 -> native Linux/WSL (install.sh), 3.12 -> container
        # (Dockerfile's pytorch/pytorch base image system Python).
        pyver: ["3.10", "3.12"]
    defaults:
      run:
        shell: bash
    env:
      MAX_JOBS: 12
    steps:
      - name: Install build dependencies
        run: |
          apt update
          apt install -y build-essential ccache cmake curl git libgomp1 libjpeg-dev libssl-dev ninja-build

      - name: Checkout llama-cpp-python (JamePeng fork, pinned commit)
        uses: actions/checkout@v6
        with:
          repository: JamePeng/llama-cpp-python
          ref: ${{ env.LLAMA_CPP_PYTHON_LINUX_REF }}
          submodules: recursive

      - name: Install uv and Python ${{ matrix.pyver }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.pyver }}
          activate-environment: true
          enable-cache: true

      - name: Show CUDA version
        run: nvcc -V

      - name: Build wheel
        env:
          LD_LIBRARY_PATH: "/usr/local/cuda/lib64:/usr/local/cuda/compat:/usr/lib/x86_64-linux-gnu"
          VERBOSE: "1"
          CUDA_HOME: "/usr/local/cuda/"
          CUDA_TOOLKIT_ROOT_DIR: "/usr/local/cuda/"
          CUDAARCHVER: ${{ env.CUDAARCHVER }}
        run: |
          set -euo pipefail

          # Build one CUDA wheel with dynamic GGML backends - runtime-selected
          # CPU backend .so's instead of one baked-in "Basic" CPU build. See
          # the matching comment in the Windows job above.
          CMAKE_ARGS_ARRAY=(
            "-G Ninja"

            # Disable non-wheel targets.
            "-DLLAMA_BUILD_EXAMPLES=OFF"
            "-DLLAMA_BUILD_TESTS=OFF"
            "-DLLAMA_BUILD_TOOLS=OFF"
            "-DLLAMA_BUILD_SERVER=OFF"
            "-DLLAMA_BUILD_UI=OFF"
            "-DLLAMA_USE_PREBUILT_UI=OFF"
            "-DLLAMA_CURL=OFF"
            "-DLLAMA_OPENSSL=ON"

            # GGML dynamic backend layout.
            "-DGGML_CPU=ON"
            "-DGGML_CUDA=ON"
            "-DGGML_NATIVE=OFF"
            "-DGGML_BACKEND_DL=ON"
            "-DGGML_CPU_ALL_VARIANTS=ON"
            "-DGGML_OPENMP=ON"

            # CUDA backend.
            "-DCMAKE_CUDA_ARCHITECTURES=${CUDAARCHVER}"
            "-DGGML_CUDA_FORCE_MMQ=ON"
            "-DCUDA_SEPARABLE_COMPILATION=ON"
            "-DCMAKE_CUDA_FLAGS=--diag-suppress=177,221,550"

            # Build behavior.
            "-DCMAKE_BUILD_PARALLEL_LEVEL=${MAX_JOBS}"
            "-DGGML_CCACHE=ON"
            "-DENABLE_CCACHE=ON"
          )
          CMAKE_ARGS="${CMAKE_ARGS_ARRAY[*]}"
          echo "CMAKE_ARGS=${CMAKE_ARGS}"

          uv pip install --upgrade build setuptools wheel packaging
          CMAKE_ARGS="${CMAKE_ARGS}" uv build --wheel

          wheel_path=$(ls dist/*.whl | head -n 1)
          filename=$(basename "$wheel_path")
          IFS='-' read -r dist_name version py_tag abi_tag plat_tag <<< "$filename"
          new_filename="${dist_name}-${version}+cu128-${py_tag}-${abi_tag}-${plat_tag}"
          mv "$wheel_path" "dist/$new_filename"
          echo "Built: $new_filename"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-py${{ matrix.pyver }}
          path: dist/*.whl
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Collects all 3 wheels into one prerelease (matching this repo's
  # existing v5.0-deps convention: prerelease, not draft, so it doesn't
  # interfere with "latest" tagging but is still directly linkable).
  # ------------------------------------------------------------------
  publish:
    name: Publish attested wheels
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd dist
          sha256sum *.whl | tee SHA256SUMS.txt

      - name: Create prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: true
          name: "llama-cpp-python 0.3.44+cu128 (attested)"
          body: |
            Attested llama-cpp-python 0.3.44 CUDA 12.8 wheels, built from
            a pinned JamePeng/llama-cpp-python commit by
            `.github/workflows/build-llama-wheels.yml`.

            Each wheel now covers all supported CUDA architectures
            (Turing through Blackwell) in one universal build - no more
            separate "standard" vs "Blackwell" variants.

            Verify provenance with:
            `gh attestation verify <wheel-file> --owner ${{ github.repository_owner }}`
          files: |
            dist/*.whl
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#eof
