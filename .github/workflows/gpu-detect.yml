# FNGarvin - Wheel Resolution Regression Suite
#
# Guards against Install.bat/install.sh crashing on GPU detection - the
# class of bug in issue #13, where a GPU-branch code path crashed
# cmd.exe's parser outright.
#
# Since the wheel rebuild in docs/BUILD_WHEELS_HOWTO.md, llama-cpp-python
# wheel selection no longer branches on GPU generation (one universal
# wheel per platform/Python-version now covers every supported CUDA
# architecture, Turing through Blackwell), so the old heavy tier here -
# real installs asserting "did it pick the Blackwell wheel vs the
# standard one" across a 2-leg GPU matrix - no longer tests anything
# real and has been removed. What's left is the fast tier: run the
# --detect-only hook against a stubbed nvidia-smi (tests/fixtures) and
# confirm it never crashes and always resolves the one correct wheel
# constant, with or without a GPU present.
name: GPU Detection Regression

on:
  push:
    branches: [ "main", "infra/*" ]
    paths:
      - 'Install.bat'
      - 'install.sh'
      - 'entrypoint.sh'
      - 'tests/**'
      - '.github/workflows/gpu-detect.yml'
  pull_request:
    branches: [ "v5-staging", "main" ]
    paths:
      - 'Install.bat'
      - 'install.sh'
      - 'entrypoint.sh'
      - 'tests/**'
      - '.github/workflows/gpu-detect.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-detect-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-detect-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run wheel resolution regression test
        shell: cmd
        run: tests\test_gpu_detect.bat

  linux-detect-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # core.filemode=false on this repo (Windows-authored), so a script's
      # +x bit isn't reliably preserved through git from a Windows commit.
      # Don't depend on the checked-out mode being right - force it.
      - name: Ensure scripts are executable
        run: chmod +x tests/fixtures/nvidia-smi tests/test_gpu_detect.sh install.sh entrypoint.sh
      - name: Ensure ffmpeg present
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run wheel resolution regression test
        run: bash tests/test_gpu_detect.sh
#eof
